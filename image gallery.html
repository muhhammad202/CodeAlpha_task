<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gallery · lightbox + filters</title>
<link rel="stylesheet" href="image gallery.css">
  <!-- Font Awesome (icons) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  
</head>
<body>

<h1>✦ image gallery</h1>
<div class="subtitle">hover · filter · lightbox</div>

<!-- filter / categories -->
<div class="filter-bar" id="filterBar">
  <button class="filter-btn active" data-filter="all"><i class="fas fa-th"></i> ALL</button>
  <button class="filter-btn" data-filter="nature"><i class="fas fa-leaf"></i> NATURE</button>
  <button class="filter-btn" data-filter="city"><i class="fas fa-city"></i> CITY</button>
  <button class="filter-btn" data-filter="portrait"><i class="fas fa-user"></i> PORTRAIT</button>
 <button class="filter-btn" data-filter="tech"><i class="fas fa-microchip"></i> Tech</button>
</div>

<!-- gallery grid -->
<div class="gallery" id="galleryGrid"></div>

<!-- lightbox -->
<div class="lightbox" id="lightbox">
  <button class="lightbox-close" id="closeLightbox"><i class="fas fa-times"></i></button>
  <button class="nav-arrow prev" id="prevImage"><i class="fas fa-chevron-left"></i></button>
  <button class="nav-arrow next" id="nextImage"><i class="fas fa-chevron-right"></i></button>
  <div class="lightbox-content" id="lightboxContent">
    <img id="lightboxImg" src="" alt="lightbox" />
  </div>
</div>
</body>
 <script src="image gallery.js"></script>
</html>
